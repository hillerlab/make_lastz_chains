name: CI

# Repo requires nextflow >=25.04.6; 26.x currently rejects its config
# (`if` block after other config). Pin to the working 25.04.6.
x-install-nextflow: &install-nextflow
  name: Install Nextflow 25.04.6
  run: |
    curl -fsSL -o /usr/local/bin/nextflow \
      https://github.com/nextflow-io/nextflow/releases/download/v25.04.6/nextflow
    chmod +x /usr/local/bin/nextflow
    nextflow -version | grep -i version

on:
  release:
    types: [ published ]
  push:
    branches: [ main ]
    tags: [ '**' ]
  pull_request:
  workflow_dispatch: {}

jobs:
  test-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - *install-nextflow
      - name: Verify docker
        run: docker info

      # Bundled smoke test: full pipeline on test_data with per-module granular
      # containers (use_container=false). Exercises every module's container.
      - name: Run test profile
        run: nextflow run main.nf -profile test,docker -w tests/work/nf_work_test

      - name: Check final chain
        run: test -f test_results/07_final/*.chain.gz

  golden-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - *install-nextflow
      - name: Verify docker
        run: docker info

      # Runs the pipeline (chainc) and diffs against committed chainCleaner
      # baselines (tests/golden/), surfacing any change. Regenerate goldens via
      # tests/ci/make_golden.sh only after an intentional, approved change.
      - name: Golden comparison (e2e + CBA clean step)
        run: bash tests/ci/compare.sh

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff-report
          path: tests/work/diff_report/
          if-no-files-found: ignore
